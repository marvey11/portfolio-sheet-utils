version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      vitest-packages:
        patterns:
          - "vitest"
          - "@vitest/*"

      typescript-eslint-packages:
        patterns:
          - "@typescript-eslint/*"

      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"

      # Optional: create a separate group for production dependencies
      prod-dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"
