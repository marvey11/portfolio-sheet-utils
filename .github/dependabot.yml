version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

      # Optional: create a separate group for production dependencies
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

    open-pull-requests-limit: 10

    ignore:
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
